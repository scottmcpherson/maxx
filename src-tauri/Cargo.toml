[workspace]
members = ["crates/maxx-core"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[package]
name = "maxx"
version = "0.1.0"
description = "Maxx provider and browser-control sidecar"
edition = "2021"
rust-version = "1.82"

[lib]
name = "maxx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
maxx-core = { path = "crates/maxx-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
# Streaming speech-to-text runs over a WebSocket (see `src/voice.rs`). rustls
# rather than native-tls so the trust roots are the same in every build; the
# `ring` provider is installed explicitly at startup because rustls 0.23 has no
# default when more than one backend could be linked.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
libc = "0.2"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
