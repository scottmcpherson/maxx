<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maxx Browser Runtime Fixture</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f5; }
      main { width: min(32rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #d4d4d8; border-radius: 1rem; background: white; box-shadow: 0 1rem 3rem rgb(0 0 0 / 8%); }
      h1 { margin-top: 0; font-size: 1.5rem; }
      output { display: block; margin: 1.25rem 0; padding: 1rem; border-radius: 0.5rem; background: #f4f4f5; font: 600 2rem ui-monospace, monospace; }
      button { border: 0; border-radius: 0.5rem; padding: 0.65rem 0.9rem; color: white; background: #18181b; font: inherit; cursor: pointer; }
      [data-state="error"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser runtime verification</h1>
      <p>Load the current build total, then increment it locally.</p>
      <output id="total" aria-live="polite">Loading…</output>
      <button id="increment" type="button">Increment total</button>
    </main>
    <script>
      const output = document.querySelector("#total");
      const button = document.querySelector("#increment");
      let total = 0;

      fetch("/browser-runtime-fixture-api.json")
        .then((response) => response.json())
        .then((payload) => {
          total = payload.total;
          if (!Number.isFinite(total)) {
            output.dataset.state = "error";
            console.error("Expected a numeric build total", { payload });
          }
          output.textContent = String(total);
        });

      button.addEventListener("click", () => {
        total += 1;
        output.textContent = String(total);
      });
    </script>
  </body>
</html>
